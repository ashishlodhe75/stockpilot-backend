# Activate with: --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockpilot_product?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development setting only. We will replace this with Flyway migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
